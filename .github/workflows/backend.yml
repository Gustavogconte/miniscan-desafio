name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      # Modelos do PaddleOCR (~15 MB) baixados na primeira execução dos testes. O cache
      # vem DEPOIS do uv sync: restaurado antes, ele criava um .venv sem Python e o
      # uv sync falhava em toda execução seguinte com o mesmo uv.lock.
      - uses: actions/cache@v4
        with:
          path: backend/.venv/lib/python3.11/site-packages/rapidocr/models
          key: modelos-rapidocr-${{ hashFiles('backend/uv.lock') }}
      # Modelo de cantos (83 MB): o comando só baixa se faltar ou se o SHA-256 não bater,
      # e testa a carga. Sem ele, o conftest.py recusa rodar os testes no CI.
      - uses: actions/cache@v4
        with:
          path: backend/modelos
          key: modelo-docaligner-${{ hashFiles('backend/app/visao/docaligner.py') }}
      - run: uv run python -m app.visao.docaligner
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
